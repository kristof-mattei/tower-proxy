# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Actionlint

on:
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-26.04
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          pyflakes: false

      # actionlint only reaches shell inside `run:` blocks, standalone scripts need their own pass
      - name: Install shellcheck
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: shellcheck

      - name: Run shellcheck
        shell: bash
        run: |
          git ls-files -z '*.sh' | xargs --null shellcheck
