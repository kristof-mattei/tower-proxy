# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Compare release image

on:
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  repo-has-container:
    name: Repo has container?
    runs-on: ubuntu-slim
    if: startsWith(github.head_ref, 'release/v')
    outputs:
      has_container: ${{ steps.determine.outputs.has_container }}
    steps:
      - name: Repo has docker container?
        shell: bash
        id: determine
        env:
          HAS_CONTAINER: ${{ vars.HAS_CONTAINER }}
        run: |
          echo "has_container=${HAS_CONTAINER:-false}" >> "${GITHUB_OUTPUT}"

  compare:
    name: Compare release image against latest
    runs-on: ubuntu-26.04
    permissions:
      actions: read # list the retag runs for the base commit
      contents: read
      packages: read # pull the images being compared from ghcr.io
      pull-requests: write # docker/scout-action posts the comparison as a PR comment
    needs:
      - repo-has-container
    if: fromJSON(needs.repo-has-container.outputs.has_container) == true
    steps:
      - name: Set full image name
        shell: bash
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY,,}/${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Find the release commit's base
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.parents[0].sha')

          echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the base commit's retag run
        id: retag_run
        uses: $/.github/actions/wait-for-retag-run
        with:
          sha: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the base commit's image
        id: base_image
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CONCLUSION: ${{ steps.retag_run.outputs.conclusion }}
          URL: ${{ steps.retag_run.outputs.url }}
        run: |
          for suffix in actual retag; do
            if docker buildx imagetools inspect "${FULL_IMAGE_NAME}:sha-${BASE_SHA}-${suffix}" > /dev/null; then
              echo "image=${FULL_IMAGE_NAME}:sha-${BASE_SHA}-${suffix}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done

          if [ -z "${URL}" ]; then
            echo "::error::No retag run found for base commit ${BASE_SHA}"
          elif [ -z "${CONCLUSION}" ]; then
            echo "::error::Retag run ${URL} for base commit ${BASE_SHA} did not complete in time"
          else
            echo "::error::Retag run ${URL} for base commit ${BASE_SHA} ended with ${CONCLUSION} and left no image"
          fi

          exit 1

      - name: Docker Scout Compare (linux/amd64)
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: compare
          image: "${{ steps.base_image.outputs.image }}"
          platform: linux/amd64
          to: "${{ env.FULL_IMAGE_NAME }}:latest"
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          organization: ${{ vars.DOCKERHUB_USERNAME }}

      - name: Docker Scout Compare (linux/arm64)
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: compare
          image: "${{ steps.base_image.outputs.image }}"
          platform: linux/arm64
          to: "${{ env.FULL_IMAGE_NAME }}:latest"
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          organization: ${{ vars.DOCKERHUB_USERNAME }}
