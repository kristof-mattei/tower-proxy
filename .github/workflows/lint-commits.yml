# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint commits

on:
  pull_request:
    branches:
      - main

concurrency:
  # each new commit to a PR runs this workflow
  # so we need to avoid a long running older one from overwriting the 'pr-<number>-latest'
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 0

      - name: Enforce strict conventional subjects
        shell: bash
        run: |
          # Enforce '<type>(<scope>)!: <description>' subjects with lowercase type and scope.
          # Also covers non-merge commits with merge-style messages, which cliff.toml's
          # ^Merge skip would otherwise exempt from the git-cliff check below.
          pattern='^[0-9a-f]+ [a-z]+(\([a-z0-9-]+\))?!?: .+$'
          if git log --no-merges --format="%h %s" "origin/${GITHUB_BASE_REF}..HEAD" | grep --extended-regexp --invert-match "${pattern}"; then
            echo "The commit(s) above do not match '<type>(<scope>)!: <description>' with a lowercase type and scope"
            exit 1
          fi

      - name: Install git-cliff to lint commits
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: git-cliff

      - name: Check the commits
        shell: bash
        env:
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
        run: |
          # The range limits linting to this PR's commits, matching the step above
          git-cliff --offline "origin/${GITHUB_BASE_REF}..HEAD" > /dev/null
