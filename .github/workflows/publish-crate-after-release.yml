# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish crate

on:
  release:
    types:
      - released
      - prereleased

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false # last one must win in case of multiple releases

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-has-crate:
    name: Repo publishes crate?
    runs-on: ubuntu-26.04
    outputs:
      has_crate: ${{ steps.determine.outputs.has_crate }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Repo has crate?
        id: determine
        shell: bash
        run: |
          has_crate="${{ vars.HAS_CRATE }}"
          echo "has_crate=${has_crate:-false}" >> "${GITHUB_OUTPUT}"

      - name: Determine version
        id: version
        shell: bash
        run: |
          version="${{ github.ref_name }}"
          # remove v
          version="${version//v/}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://crates.io/crates/${{ github.event.repository.name }}/${{ needs.repo-has-crate.outputs.version }}
    permissions:
      contents: read
      id-token: write
    needs:
      - repo-has-crate
    if: |
      fromJSON(needs.repo-has-crate.outputs.has_crate) == true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Set up mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Set up toolchain
        shell: bash
        run: |
          rm "${HOME}/.cargo/bin/cargo-fmt"
          rm "${HOME}/.cargo/bin/rust-analyzer"
          rm "${HOME}/.cargo/bin/rustfmt"

          rustup self update
          rustup update
          rustup show active-toolchain || rustup toolchain install
          rustup show

          cargo --version

      - name: Install cargo-edit to do set-version
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-edit

      - name: Set version in Cargo.toml / Cargo.lock
        shell: bash
        run: |
          cargo set-version "${{ needs.repo-has-crate.outputs.version }}"

          git diff

          # debug
          cat Cargo.toml

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # we don't commit the version number in our codebase
          cargo publish --allow-dirty
