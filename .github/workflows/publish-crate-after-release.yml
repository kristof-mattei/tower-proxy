# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish crate

on:
  release:
    types:
      - released
      - prereleased

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false # last one must win in case of multiple releases

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Publish crate
    runs-on: ubuntu-26.04
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ github.event.repository.name }}/${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates-io-auth-action exchanges this for a publish token
    if: |
      vars.HAS_CRATE == 'true'
    steps:
      - name: Determine version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # tags are vX.Y.Z, crates.io versions are not prefixed
          echo "version=${REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Set up toolchain
        shell: bash
        run: |
          rm "${HOME}/.cargo/bin/cargo-fmt"
          rm "${HOME}/.cargo/bin/rust-analyzer"
          rm "${HOME}/.cargo/bin/rustfmt"

          rustup self update
          rustup update
          rustup show active-toolchain || rustup toolchain install
          rustup show

          cargo --version

      - name: Install cargo-edit to do set-version
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-edit

      - name: Set version in Cargo.toml / Cargo.lock
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo set-version "${VERSION}"

          git diff

          # debug
          cat Cargo.toml

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # we don't commit the version number in our codebase
          cargo publish --allow-dirty
