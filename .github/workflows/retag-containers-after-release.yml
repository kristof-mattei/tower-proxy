# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Retag container after release

on:
  release:
    types:
      - released
      - prereleased

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false # last one must win in case of multiple releases

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}

jobs:
  repo-has-container:
    name: Repo has container?
    runs-on: ubuntu-26.04
    outputs:
      has_container: ${{ steps.determine.outputs.has_container }}

    steps:
      - name: Repo has docker container?
        id: determine
        shell: bash
        env:
          HAS_CONTAINER: ${{ vars.HAS_CONTAINER }}
        run: |
          echo "has_container=${HAS_CONTAINER:-false}" >> "${GITHUB_OUTPUT}"

  retag-containers:
    name: Retag the containers
    runs-on: ubuntu-26.04
    permissions:
      artifact-metadata: write # actions/attest
      attestations: write # actions/attest
      contents: read
      id-token: write # actions/attest
      packages: write # retag images in ghcr.io
    needs:
      - repo-has-container
    if: |
      fromJSON(needs.repo-has-container.outputs.has_container) == true
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}

      - name: Log into Docker Hub
        if: env.DOCKERHUB_IMAGE_NAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set full image name
        shell: bash
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY,,}/${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "FULL_DOCKERHUB_IMAGE_NAME=docker.io/${DOCKERHUB_IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Find source tag using GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo_lower="${GITHUB_REPOSITORY,,}"

          # the push-triggered retag workflow creates the source tag and may still be running, so poll for it
          OLD_TAG=""

          for attempt in $(seq 1 30); do
            if ((attempt > 1)); then
              sleep 30
            fi

            echo "Looking for source tag sha-${GITHUB_SHA}-* (attempt ${attempt} of 30)"

            # no match yet and a transient api error both mean retry, so don't fail here
            OLD_TAG=$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${repo_lower##*/}/versions" \
              --paginate \
              --jq '.[] | .metadata.container.tags[]' | grep "^sha-${GITHUB_SHA}-.*\$" | head --lines 1) || true # .* is actual or retag

            if [ -n "${OLD_TAG}" ]; then
              break
            fi
          done

          if [ -z "${OLD_TAG}" ]; then
            echo "::error::No matching source tag found for SHA ${GITHUB_SHA}"
            exit 1
          fi

          echo "OLD_TAG=${OLD_TAG}" >> "${GITHUB_ENV}"

      - name: Set the new TAGs
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{version}},prefix=v

      - name: Set the new Docker Hub TAGs
        if: env.DOCKERHUB_IMAGE_NAME != ''
        id: meta-dockerhub
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "docker.io/${{ env.DOCKERHUB_IMAGE_NAME }}"
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{version}},prefix=v

      - name: Get image digest
        shell: bash
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${FULL_IMAGE_NAME}:${OLD_TAG}" --format "{{json .}}" | jq --raw-output ".manifest.digest")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Actually re-tag the container
        shell: bash
        env:
          NEW_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "${NEW_TAGS}" | while IFS= read -r new_tag
            do
              docker buildx imagetools create --tag "${new_tag}" "${FULL_IMAGE_NAME}:${OLD_TAG}"
          done

      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FULL_IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Copy the container to Docker Hub
        if: env.DOCKERHUB_IMAGE_NAME != ''
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          NEW_TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          echo "${NEW_TAGS}" | while IFS= read -r new_tag
            do
              if [ "$(skopeo inspect --format '{{ .Digest }}' --no-tags "docker://${new_tag}" 2>/dev/null)" = "${DIGEST}" ]; then
                echo "${new_tag} already exists, skipping"
                continue
              fi

              skopeo copy --all --preserve-digests --command-timeout 70s --retry-times 5 "docker://${FULL_IMAGE_NAME}:${OLD_TAG}" "docker://${new_tag}"
          done

      - name: Attest Docker Hub image
        if: env.DOCKERHUB_IMAGE_NAME != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FULL_DOCKERHUB_IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Docker Scout (linux/amd64)
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: "${{ env.FULL_IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"
          platform: linux/amd64
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout (linux/arm64)
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: "${{ env.FULL_IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"
          platform: linux/arm64
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  repo-has-deb:
    name: Repo has deb?
    runs-on: ubuntu-26.04
    outputs:
      has_deb: ${{ steps.determine.outputs.has_deb }}

    steps:
      - name: Repo publishes a Debian package?
        id: determine
        shell: bash
        env:
          HAS_DEB: ${{ vars.HAS_DEB }}
        run: |
          echo "has_deb=${HAS_DEB:-false}" >> "${GITHUB_OUTPUT}"

  retag-deb:
    name: Retag the Debian packages
    runs-on: ubuntu-26.04
    timeout-minutes: 30 # the source tag poll below alone may take 15 minutes
    permissions:
      artifact-metadata: write # actions/attest
      attestations: write # actions/attest
      contents: read
      id-token: write # actions/attest
      packages: write # retag the debs in ghcr.io
    needs:
      - repo-has-deb
    # the predicted version has no pre-release suffix, so pre-releases ship without debs
    if: |
      fromJSON(needs.repo-has-deb.outputs.has_deb) == true &&
      !github.event.release.prerelease
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set full deb artifact name
        shell: bash
        run: |
          echo "FULL_DEB_NAME=${REGISTRY,,}/${IMAGE_NAME,,}-deb" >> "${GITHUB_ENV}"

      - name: Log into registry ${{ env.REGISTRY }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login "${REGISTRY,,}" --username "${GITHUB_ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"

      - name: Find source tag in the registry
        shell: bash
        run: |
          # the push-triggered retag workflow creates the source tag and may still be running, so poll for it
          OLD_TAG=""

          for attempt in $(seq 1 30); do
            if ((attempt > 1)); then
              sleep 30
            fi

            echo "Looking for source tag sha-${GITHUB_SHA}-* (attempt ${attempt} of 30)"

            # a failed resolve is a missing tag or a transient error, both mean retry
            for suffix in actual retag; do
              if oras resolve "${FULL_DEB_NAME}:sha-${GITHUB_SHA}-${suffix}" > /dev/null 2>&1; then
                OLD_TAG="sha-${GITHUB_SHA}-${suffix}"
                break
              fi
            done

            if [ -n "${OLD_TAG}" ]; then
              break
            fi
          done

          if [ -z "${OLD_TAG}" ]; then
            echo "::error::No matching source tag found for SHA ${GITHUB_SHA}"
            exit 1
          fi

          echo "OLD_TAG=${OLD_TAG}" >> "${GITHUB_ENV}"

      - name: Pull the Debian packages
        shell: bash
        run: |
          mkdir --parents /tmp/deb

          oras pull "${FULL_DEB_NAME}:${OLD_TAG}" --output /tmp/deb

      - name: Assert deb versions match the release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}-1"

          for deb_file in /tmp/deb/*.deb; do
            actual=$(dpkg-deb --field "${deb_file}" Version)

            if [ "${actual}" != "${expected}" ]; then
              # graduation checked the same debs, so a mismatch here means the registry chain diverged
              echo "::error::Debian package version ${actual} of ${deb_file} does not match release version ${expected}, not re-tagging"
              exit 1
            fi
          done

      - name: Verify build attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh attestation verify takes exactly one subject at a time
          for deb_file in /tmp/deb/*.deb; do
            gh attestation verify "${deb_file}" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Re-tag the debs with the release version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          oras tag "${FULL_DEB_NAME}:${OLD_TAG}" "${TAG}" "latest"

      # graduate-release attached the debs while the release was a draft, it is immutable now
      - name: Attest Debian packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: /tmp/deb/*.deb
