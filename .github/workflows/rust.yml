# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Rust

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_FEATURES: --all-features
  CARGO_INCREMENTAL: "0"
  # `RUSTFLAGS` replaces the rustflags in `.cargo/config.toml`, so it cannot be used here
  # https://doc.rust-lang.org/cargo/reference/config.html#buildrustflags
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: --deny=warnings
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR's changed files
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          # on push events dorny/paths-filter diffs against github.event.before over git and fetches it with the persisted credentials
          persist-credentials: true
          show-progress: false

      - name: Check if we actually made changes
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/file-filters.yml

  cargo-build:
    name: Cargo build
    runs-on: ubuntu-26.04
    steps:
      - &checkout
        name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - &set_up_mold
        name: Set up mold
        uses: rui314/setup-mold@v1

      - &set_up_toolchain
        name: Set up toolchain
        shell: bash
        run: |
          rm "${HOME}/.cargo/bin/cargo-fmt"
          rm "${HOME}/.cargo/bin/rust-analyzer"
          rm "${HOME}/.cargo/bin/rustfmt"

          rustup self update
          rustup update
          rustup show active-toolchain || rustup toolchain install
          rustup show

          cargo --version

      - &set_up_sccache
        name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build
        shell: bash
        run: |
          # shellcheck disable=SC2086 # CARGO_FEATURES can hold more than one flag
          cargo build ${CARGO_FEATURES} --all-targets --locked --workspace

  cargo-examples:
    name: Cargo examples
    runs-on: ubuntu-26.04
    needs:
      - changes
    if: |
      github.event_name == 'pull_request' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - *checkout

      - *set_up_mold

      - *set_up_toolchain

      - *set_up_sccache

      - name: Run examples
        shell: bash
        run: |
          for example in examples/*.rs
          do
            # shellcheck disable=SC2086 # CARGO_FEATURES can hold more than one flag
            cargo run --example "$(basename "${example%.rs}")" ${CARGO_FEATURES} --features="$(cat "${example%.rs}-features")"
          done

  cargo-fmt:
    name: Cargo fmt
    runs-on: ubuntu-26.04
    needs:
      - changes
    if: |
      github.event_name == 'pull_request' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - *checkout

      - *set_up_toolchain

      - name: Install nightly rustfmt
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check formatting
        shell: bash
        run: |
          cargo +nightly fmt --all -- --check

  cargo-test-and-report:
    name: Cargo test (and report)
    runs-on: ubuntu-26.04
    permissions:
      checks: write # publish-unit-test-result-action creates a check run
      contents: read
      id-token: write # codecov-action authenticates over OIDC
      issues: read # publish-unit-test-result-action needs this in private repos
      pull-requests: write # publish-unit-test-result-action comments the test summary
    steps:
      - *checkout

      - *set_up_mold

      - *set_up_toolchain

      - *set_up_sccache

      - name: Install llvm-tools
        shell: bash
        run: |
          rustup component add llvm-tools

          # restore symlinks
          rustup update

      - name: Install nextest, custom test runner, with native support for junit and grcov
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-nextest, grcov

      - name: Build with instrumentation support
        shell: bash
        run: |
          ./generate-test-report.sh build

      - name: Run nextest
        shell: bash
        id: tests
        run: |
          ./generate-test-report.sh test
        continue-on-error: true

      - name: Upload test results
        # fork PRs run with a read-only token, which cannot create check runs or PR comments
        if: |
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: EnricoMi/publish-unit-test-result-action@v2.25.0
        with:
          check_name: Test results for Rust
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            reports/results.xml

      - name: Run grcov
        shell: bash
        env:
          GRCOV_OUTPUT_TYPES: lcov
        run: |
          ./generate-test-report.sh report

      - name: Record Rust version
        shell: bash
        run: |
          echo "RUST=$(rustc --version)" >> "$GITHUB_ENV"

      - name: Upload coverage results (to Codecov.io)
        # fork PRs run without id-token, so OIDC upload cannot work. Push runs must keep uploading to preserve base coverage
        if: |
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          disable_telem: true
          env_vars: RUNNER_OS,RUST
          fail_ci_if_error: true
          # flags: tests
          files: reports/lcov
          name: code-coverage
          plugins: noop
          report_type: "coverage"
          use_oidc: true

      - name: Upload test results (to Codecov.io)
        if: |
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          disable_telem: true
          env_vars: RUNNER_OS,RUST
          fail_ci_if_error: true
          # flags: tests
          files: reports/results.xml
          name: test-results
          plugins: noop
          report_type: "test_results"
          use_oidc: true

      - name: Fail if tests failed
        shell: bash
        if: |
          steps.tests.outcome != 'success'
        run: |
          # the test reporter we use (or any for that matter)
          # all show a report. But we cannot depend on that report because
          # we don't know which subsection it belongs in GitHub
          # so we explicitly fail this one
          # which will fail All Done
          exit 1

  cargo-clippy-and-report:
    name: Cargo clippy (and report)
    runs-on: ubuntu-26.04
    needs:
      - changes
    if: |
      github.event_name == 'pull_request' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - *checkout

      - *set_up_mold

      - *set_up_toolchain

      - *set_up_sccache

      - name: Run Clippy for GitHub Actions report
        uses: actions-rs-plus/clippy-check@v2.7.1
        with:
          args: ${{ env.CARGO_FEATURES }} --all-targets --locked --workspace

  cargo-msrv:
    name: Cargo MSRV
    runs-on: ubuntu-26.04
    needs:
      - changes
    if: |
      github.event_name == 'pull_request' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - *checkout

      - *set_up_mold

      - name: Get MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          msrv=$(cargo metadata --format-version 1 --no-deps | jq '.packages[] | .rust_version' --raw-output)
          echo "msrv=${msrv}" >> "${GITHUB_OUTPUT}"

      - name: Install MSRV toolchain
        shell: bash
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          rustup toolchain install "${MSRV}" --profile minimal

      - *set_up_sccache

      - name: Check with MSRV
        shell: bash
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
        run: |
          cargo "+${MSRV}" check --locked

  cargo-minimal-versions:
    name: Cargo minimal versions
    runs-on: ubuntu-26.04
    needs:
      - changes
    if: |
      github.event_name == 'pull_request' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - *checkout

      - *set_up_mold

      - *set_up_toolchain

      - name: Install nightly toolchain
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal

      - *set_up_sccache

      - name: Resolve direct dependencies to their minimal versions
        shell: bash
        run: |
          cargo +nightly update -Z direct-minimal-versions

      - name: Check with minimal versions
        shell: bash
        run: |
          # shellcheck disable=SC2086 # CARGO_FEATURES can hold more than one flag
          cargo check ${CARGO_FEATURES} --all-targets --locked --workspace

      - name: Test with minimal versions
        shell: bash
        run: |
          # shellcheck disable=SC2086 # CARGO_FEATURES can hold more than one flag
          cargo test ${CARGO_FEATURES} --all-targets --locked --workspace

  cargo-semver-checks-baseline:
    name: Calculate the semver-checks baseline
    runs-on: ubuntu-slim
    needs:
      - changes
    outputs:
      latest-tag: ${{ steps.version.outputs.latest-tag }}
      next-version: ${{ steps.version.outputs.next-version }}
    if: |
      github.event_name == 'pull_request' &&
      vars.HAS_CRATE == 'true' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Install git-cliff to calculate the next version number
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: git-cliff

      - name: Calculate next version
        id: version
        uses: $/.github/actions/calculate-next-version

  cargo-semver-checks:
    name: Cargo semver-checks
    runs-on: ubuntu-26.04
    needs:
      - cargo-semver-checks-baseline
    # before the first release there is no published API to break
    if: |
      needs.cargo-semver-checks-baseline.outputs.latest-tag != ''
    steps:
      - *checkout

      - name: Check out the latest release
        uses: actions/checkout@v7.0.1
        with:
          path: baseline
          persist-credentials: false
          ref: ${{ needs.cargo-semver-checks-baseline.outputs.latest-tag }}
          show-progress: false

      # if the baseline is inside the working directory, `cargo semver-checks` finds the package twice and fails
      - name: Move the baseline out of the working directory
        shell: bash
        run: |
          mv baseline "${RUNNER_TEMP}/baseline"

      - *set_up_mold

      - *set_up_toolchain

      # `cargo-edit` builds from source through `RUSTC_WRAPPER`, so sccache has to be set up first
      - *set_up_sccache

      - name: Install cargo-semver-checks, and cargo-edit to do set-version
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-semver-checks,cargo-edit

      - name: Set the released and the next version in Cargo.toml / Cargo.lock
        shell: bash
        env:
          LATEST_TAG: ${{ needs.cargo-semver-checks-baseline.outputs.latest-tag }}
          NEXT_VERSION: ${{ needs.cargo-semver-checks-baseline.outputs.next-version }}
        run: |
          # the version is not committed, and `cargo semver-checks` derives the allowed changes from the baseline and current versions
          cargo set-version --manifest-path "${RUNNER_TEMP}/baseline/Cargo.toml" "${LATEST_TAG#v}"
          cargo set-version "${NEXT_VERSION}"

      - name: Check the public API against the latest release
        shell: bash
        run: |
          cargo semver-checks --baseline-root "${RUNNER_TEMP}/baseline"

  cargo-docs:
    name: Cargo docs (nightly)
    runs-on: ubuntu-26.04
    needs:
      - changes
    if: |
      github.event_name == 'pull_request' &&
      fromJSON(needs.changes.outputs.rust) == true
    steps:
      - *checkout

      - *set_up_mold

      - name: Install nightly toolchain
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal

      - *set_up_sccache

      - name: Build docs
        shell: bash
        env:
          RUSTDOCFLAGS: "--cfg docsrs --deny=warnings"
        run: |
          # shellcheck disable=SC2086 # CARGO_FEATURES can hold more than one flag
          cargo +nightly doc ${CARGO_FEATURES} --locked --workspace --no-deps

  all-done:
    name: Rust All done
    # this is the job that should be marked as required on GitHub. It's the only one that'll reliably trigger
    # when any upstream fails or is cancelled: failure
    # when all upstream skips: success
    # when all upstream success: success
    # combination of upstream skip and success: success
    runs-on: ubuntu-slim
    permissions: {}
    needs:
      - changes
      - cargo-build
      - cargo-clippy-and-report
      - cargo-docs
      - cargo-examples
      - cargo-fmt
      - cargo-minimal-versions
      - cargo-msrv
      - cargo-semver-checks
      - cargo-semver-checks-baseline
      - cargo-test-and-report
    if: |
      !cancelled()
    steps:
      - name: Fail!
        shell: bash
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One / more upstream failed or was cancelled. Failing job..."

          exit 1

      - name: Success!
        shell: bash
        run: |
          echo "Great success!"
