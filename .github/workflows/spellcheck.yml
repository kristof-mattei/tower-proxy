# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Spellcheck

on:
  pull_request:
    branches:
      - main

concurrency:
  # each new commit to a PR runs this workflow, the older run's result is obsolete, so cancel it
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: false

jobs:
  spellcheck:
    name: Spellcheck
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Make sure dictionary words are sorted and unique
        shell: bash
        run: |
          FILE="project-words.txt"

          # `sort` makes sure the words are sorted and contain no duplicates.
          #
          # Since `sort` is sensitive to locale, we set it
          # using LC_ALL to en_US.UTF8 to be consistent in different
          # environments.

          (
            LC_ALL=en_US.UTF8 sort --check --unique "$FILE"
          ) || {
            echo "Dictionary is not in sorted order. Correct order is:"
            LC_ALL=en_US.UTF8 sort --unique "$FILE"
            false
          }

      - name: Detect trailing whitespace
        shell: bash
        run: |
          if git grep -I --line-number --untracked '[[:space:]]$'
          then
              echo ''
              echo 'Please remove trailing whitespace from these lines.'
              exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Run cspell
        shell: bash
        run: |
          if ! pnpm spellcheck
          then
              echo ''
              echo ''
              echo 'If this is a real word, then you can add it to project-words.txt'
              exit 1
          fi
