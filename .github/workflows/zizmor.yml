# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Zizmor

on:
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install zizmor
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: zizmor

      - name: Run zizmor
        shell: bash
        env:
          # a token switches zizmor out of offline mode, enabling the audits that
          # query GitHub (known-vulnerable actions, ref resolution)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zizmor --persona=pedantic .github
